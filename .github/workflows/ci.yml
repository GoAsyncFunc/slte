name: SLTE CI

# 质量门禁（阻断）：单元测试 + ktlint。
# 与 build.yml（手动打包机）分离：打包流程面向 fork 用户，测试仅提示；
# 本工作流对仓库自身改动强制执行质量门禁（对应桌面端 scripts/check.sh 的角色）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取代进行中的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 单元测试 + ktlint
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受 SDK 许可（单元测试无需装 NDK，仅需通过 AGP 配置阶段的许可检查）
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER" || { echo "::error::找不到 sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: ktlint + 单元测试（不通过即失败）
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck :app:testDebugUnitTest
