org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

org.gradle.configuration-cache=true

kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 截图回归默认走「比对」而不是「录制」：录制模式下 captureRoboImage 会直接改写基线，
# 测试永远不会失败，等于没有防线。verify = 基线存在则比对（不一致即失败），
# 缺失则自动录制；更新基线用 `./gradlew :app:recordRoborazziDebug`，让改动留在提交里可评审。
roborazzi.test.verify=true
